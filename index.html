<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>
  <link rel="preload" href="css/normalize.css">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <link rel="preload" href="css/styles.css" as="styles">
  <link rel="stylesheet" href="css/styles.css">


</head>

<body>
  <main>
    <div class="contenedor">
      <img class="qr" src="images/image-qr-code.png" alt="imagen qr">

      <h1 class="titulo">Improve your front-end skills by building projects</h1>

      <p class="instruccion-qr">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>
    </div>
  </main>

</body>

</html>
